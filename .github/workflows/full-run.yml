name: Full run

# The committed reports/metrics.json comes from the local M2 run. This workflow exists to
# re-derive it on a clean Linux runner: start it by hand (Actions, Full run, Run workflow) and
# compare the uploaded metrics.json with the committed one. It has no schedule on purpose: the
# run takes hours, so it happens only when someone asks for it.
on:
  workflow_dispatch:

concurrency:
  group: full-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --group dev --python 3.11 --locked
      - name: Restore the SMD cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/tsguard
          key: smd-${{ hashFiles('src/tsguard/data/smd_manifest.json') }}
      - name: Fetch SMD (a no-op on a warm cache)
        run: |
          # The fetch is idempotent, so a transient failure (for example a 429 from
          # raw.githubusercontent.com) is retried instead of turning the job red.
          for attempt in 1 2 3; do
            if uv run tsguard data fetch; then
              exit 0
            fi
            echo "::warning::data fetch attempt ${attempt} of 3 failed"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1
      # The step times out before the job does (the job's 360 minutes are the hosted-runner
      # ceiling), so the upload below still gets its 20 minutes after a run that never ends.
      - name: Reproduce the full profile
        timeout-minutes: 340
        run: uv run tsguard reproduce --profile full --out artifacts/full
      # The directory holds metrics.json and mlflow_runs.csv, and the MLflow store beside them:
      # after a failure the store is the only trace of the runs that did finish.
      - name: Keep the full-run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-run-artifacts
          path: artifacts/full
          if-no-files-found: warn
