version: 2

# One pull request per ecosystem per month: every dependency of an ecosystem is updated in a
# single sweep, so the combination that gets merged is the combination that was tested.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"

  # The python base image of the Dockerfile, pinned by digest. Only new digests of the same tag are
  # proposed: the build installs into the image's own interpreter and never downloads one
  # (UV_PYTHON_DOWNLOADS=never), so the image's python must be the one .python-version names. A new
  # python minor or major moves by hand, together with .python-version.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
