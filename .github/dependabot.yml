version: 2

# One pull request per ecosystem per week: every dependency of an ecosystem is updated in a
# single sweep, so the combination that gets merged is the combination that was tested.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
